<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Si</title>
  <meta name="description" content="Log in to your Si account">
  <meta name="theme-color" content="#1B6B3A">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/star.png">

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, var(--white) 0%, var(--sage-light) 50%, var(--green-50) 100%);
      padding: 40px 20px;
    }
    .auth-card {
      background: var(--white);
      border-radius: var(--radius-2xl);
      box-shadow: var(--shadow-xl);
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
    }
    .auth-card__logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-card__logo img {
      height: 95px;
      margin: 0 auto;
    }
    .auth-card__title {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      text-align: center;
      margin-bottom: 8px;
    }
    .auth-card__subtitle {
      font-size: 15px;
      color: var(--neutral-500);
      text-align: center;
      margin-bottom: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
      border: 2px solid var(--neutral-200);
      border-radius: var(--radius-md);
      transition: all 0.2s;
      background: var(--white);
      color: var(--dark);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--green-700);
      box-shadow: 0 0 0 3px rgba(27, 107, 58, 0.1);
    }
    .form-input:disabled {
      background: var(--neutral-50);
      cursor: not-allowed;
    }
    .form-error {
      background: #FEE;
      border: 1px solid #FCC;
      color: #C33;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .form-error.visible {
      display: block;
    }
    .form-success {
      background: #EFE;
      border: 1px solid #CFC;
      color: #3C3;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .form-success.visible {
      display: block;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      background: var(--green-700);
      color: var(--white);
      border: none;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--green-800);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-google {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      background: var(--white);
      color: var(--neutral-700);
      border: 2px solid var(--neutral-200);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn-google:hover {
      background: var(--neutral-50);
      border-color: var(--neutral-300);
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: var(--neutral-400);
      font-size: 14px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--neutral-200);
    }
    .auth-footer {
      text-align: center;
      font-size: 14px;
      color: var(--neutral-500);
      margin-top: 24px;
    }
    .auth-footer a {
      color: var(--green-700);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      color: var(--green-800);
      text-decoration: underline;
    }
    .back-home {
      display: inline-block;
      color: var(--green-700);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    .back-home:hover {
      color: var(--green-800);
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="back-home">← Back to home</a>

      <div class="auth-card__logo">
        <img src="images/logo.png" alt="Si">
      </div>

      <h1 class="auth-card__title">Welcome back</h1>
      <p class="auth-card__subtitle">Log in to your Si account</p>

      <div id="error" class="form-error"></div>
      <div id="success" class="form-success"></div>

      <div id="g_id_onload"
           data-client_id="168685371164-20j32pshd44p42rrn03fgv1ptdhfl6vp.apps.googleusercontent.com"
           data-callback="handleGoogleSignIn"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="continue_with"
           data-shape="pill"
           data-logo_alignment="left"
           data-width="360">
      </div>

      <div class="divider">or</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Log In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://si-international-money-transfer.onrender.com';
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add('visible');
      successDiv.classList.remove('visible');
    }

    function showSuccess(message) {
      successDiv.textContent = message;
      successDiv.classList.add('visible');
      errorDiv.classList.remove('visible');
    }

    function hideMessages() {
      errorDiv.classList.remove('visible');
      successDiv.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const response = await fetch(API_URL + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login failed');
        }

        // Store tokens
        localStorage.setItem('accessToken', data.accessToken);
        localStorage.setItem('refreshToken', data.refreshToken);
        localStorage.setItem('user', JSON.stringify(data.user));

        showSuccess('Login successful! Redirecting...');

        // Redirect to app (you can change this URL)
        setTimeout(() => {
          window.location.href = '/app';
        }, 1000);

      } catch (error) {
        showError(error.message || 'Failed to log in. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    });

    // Google Sign-In callback
    window.handleGoogleSignIn = async (response) => {
      hideMessages();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in with Google...';

      try {
        const result = await fetch(API_URL + '/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken: response.credential })
        });

        const data = await result.json();

        if (!result.ok) {
          throw new Error(data.message || 'Google sign-in failed');
        }

        // Store tokens
        localStorage.setItem('accessToken', data.accessToken);
        localStorage.setItem('refreshToken', data.refreshToken);
        localStorage.setItem('user', JSON.stringify(data.user));

        showSuccess('Login successful! Redirecting...');

        setTimeout(() => {
          window.location.href = '/app';
        }, 1000);

      } catch (error) {
        showError(error.message || 'Google sign-in failed. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    };
  </script>
</body>
</html>
